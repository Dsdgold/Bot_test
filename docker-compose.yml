services:
  scraper-bot:
    build: .
    container_name: scraper-bot
    ports:
      - "8000:8000"
    volumes:
      - ./exports:/app/exports
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"

  # Optional: nginx reverse proxy for production
  nginx:
    image: nginx:alpine
    container_name: scraper-nginx
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - scraper-bot
    restart: unless-stopped
