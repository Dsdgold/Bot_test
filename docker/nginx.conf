upstream scraper_backend {
    server scraper-bot:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 50M;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1000;

    location / {
        proxy_pass http://scraper_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (for future use)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts for long scraping jobs
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Cache static files
    location /static/ {
        proxy_pass http://scraper_backend/static/;
        proxy_cache_valid 200 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    # CSV downloads
    location /api/exports/ {
        proxy_pass http://scraper_backend/api/exports/;
        proxy_read_timeout 60s;
    }
}
